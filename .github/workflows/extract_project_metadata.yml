name: Extract Markdown Metadata to Spreadsheet

on:
  push:
    branches:
      - main # Or your default branch
    paths:
      - 'projects/**/README.md' # Adjust this path to where your MD files are located

jobs:
  extract_and_update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2 # Use a dedicated action for R setup
      with:
        # It's good practice to specify an R version, e.g., 'release' or '4.3.2'
        r-version: 'release' 

    # --- Recommended way to install R dependencies in GitHub Actions ---
    - name: Install R package dependencies (including system dependencies)
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          yaml
          dplyr
          readr
          googlesheets4
        # You can add a cache key if you want to cache installed packages
        # cache-version: 1 # Increment this if you change your R package dependencies
        # cache-dependency-path: | # Add paths to files that define dependencies (e.g., DESCRIPTION or renv.lock)
        #   .github/workflows/extract_metadata.R 

    - name: Authenticate with Google Sheets
      run: |
        R -e '
          # Authenticate with Google Sheets using Service Account (recommended)
          # Make sure GOOGLE_CREDENTIALS is a secret containing the JSON key file content
          # This should be defined in the workflow's 'env' section for this step
          googlesheets4::gs4_auth(path = Sys.getenv("GOOGLE_CREDENTIALS"))

          # To debug: Check if authentication worked
          print(googlesheets4::gs4_user())
        '
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS }}

    - name: Run R script to extract and update spreadsheet
      run: Rscript .github/workflows/extract_metadata.R
