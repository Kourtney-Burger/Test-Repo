name: Create Sub-Issues from Checked Lab Processes

on:
  issues:
    types: [opened, edited]

jobs:
  create-subissues:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Create and link sub-issues
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const issueBody = issue.body;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const checkedRegex = /- \[x\] (.+)/gi;
            let match;
            const checkedItems = [];

            while ((match = checkedRegex.exec(issueBody)) !== null) {
              checkedItems.push(match[1].trim());
            }

            // Get existing sub-issues already created for this parent
            const { data: allIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              per_page: 100
            });

            const existingSubIssues = allIssues.filter(i =>
              i.body?.includes(`Parent issue: #${issueNumber}`)
            );

