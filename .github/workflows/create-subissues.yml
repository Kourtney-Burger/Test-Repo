name: Create Sub-Issues from Checked Lab Processes

on:
  issues:
    types: [opened, edited]

jobs:
  create-subissues:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Create and link sub-issues
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const issueBody = issue.body;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const checkedRegex = /- \[x\] (.+)/gi;
            let match;
            const checkedItems = [];

            while ((match = checkedRegex.exec(issueBody)) !== null) {
              checkedItems.push(match[1].trim());
            }

            // Get existing sub-issues already created for this parent
            const allIssuesResponse = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              per_page: 100
            });

            const allIssues = allIssuesResponse.data;

            const existingSubIssues = allIssues.filter(i =>
              i.body && i.body.includes(`Parent issue: #${issueNumber}`)
            );

            const existingTitles = existingSubIssues.map(i => i.title);
            const existingTaskList = existingSubIssues.map(i => `- [ ] #${i.number}`);

            const createdSubIssues = [];

            for (const item of checkedItems) {
              const subTitle = `Sub-task: ${item}`;

              if (existingTitles.includes(subTitle)) {
                console.log(`Sub-issue for "${item}" already exists.`);
                continue;
              }

              const subIssue = await github.rest.issues.create({
                owner,
                repo,
                title: subTitle,
                body: `Tracking progress for lab process: **${item}**\n\nParent issue: #${issueNumber}`,
                labels: ['lab-process']
              });

              createdSubIssues.push(subIssue.data);
            }

            // Combine existing and new task list items
            const newTaskList = [
              ...existingTaskList,
              ...createdSubIssues.map(sub => `- [ ] #${sub.number}`)
            ];

            if (newTaskList.length > 0) {
              let updatedBody = issueBody;

              // Remove any existing task list section
              const taskListRegex = /### Linked Sub-Issues\n(?:- \[.\] #[0-9]+\n*)*/gi;
              updatedBody = updatedBody.replace(taskListRegex, '').trim();

              updatedBody += `\n\n### Linked Sub-Issues\n${newTaskList.join('\n')}`;

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issueNumber,
                body: updatedBody
              });

              console.log('Updated parent issue with sub-issue links.');
            }
